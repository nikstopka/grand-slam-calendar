name: Обновление расписания турниров

on:
  # Запуск по расписанию: каждые 30 минут.
  # Скрипт сам решает, нужен ли запуск:
  #   • бесплатный провайдер — обновляет данные раз в ~25 минут (запросы не тарифицируются);
  #   • Sportradar — не чаще раза в 4 часа, чтобы не выйти за лимит 1000 запросов в месяц.
  # Спортивные результаты и live-счёт обновляются по мере завершения матчей.
  schedule:
    - cron: '*/30 * * * *'
  # Ручной запуск
  workflow_dispatch:

permissions:
  contents: write

# Одновременные запуски не должны конфликтовать при git push
concurrency:
  group: update-schedule
  cancel-in-progress: false

jobs:
  update-schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      # 1. Получаем код репозитория
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Устанавливаем Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Кэш (экономит лимит API: каталог турниров, сезоны, фото)
      - name: Restore API cache
        uses: actions/cache@v4
        with:
          path: .cache
          # Уникальный ключ → всегда создаётся новая запись кэша;
          # restore-keys восстанавливает самый свежий предыдущий.
          key: tennis-cache-${{ github.run_id }}
          restore-keys: |
            tennis-cache-

      # 4. Проверяем синтаксис скрипта
      - name: Check script syntax
        run: python -m py_compile scripts/fetch_tennis.py

      # 5. Запускаем скрипт обновления
      - name: Fetch tournament data
        env:
          SPORTRADAR_API_KEY: ${{ secrets.SPORTRADAR_API_KEY }}
          LIVETENNIS_API_KEY: ${{ secrets.LIVETENNIS_API_KEY }}
        run: python scripts/fetch_tennis.py

      # 5a. Собираем новости ATP / WTA / Tennis.com и переводим на русский
      - name: Fetch tennis news
        run: |
          pip install requests beautifulsoup4 lxml
          python scripts/fetch_news.py || true

      # 5b. Генерируем ICS-календари для подписки
      - name: Generate calendars
        run: |
          pip install requests beautifulsoup4 lxml
          python scripts/generate_ics.py || true

      # 6. Проверяем, что данные валидны
      - name: Validate data
        run: |
          python - <<'PY'
          import json, glob, os
          index = json.load(open('data/index.json', encoding='utf-8-sig'))
          assert 'tournaments' in index, 'index.json: нет списка турниров'
          for t in index['tournaments']:
              path = os.path.join('data', 'tournaments', t['slug'] + '.json')
              data = json.load(open(path, encoding='utf-8-sig'))
              assert 'years' in data, path
          json.load(open('data/rankings.json', encoding='utf-8-sig'))
          json.load(open('data/players.json', encoding='utf-8-sig'))
          # Фото турниров и профили игроков — необязательные: собираются из Википедии
          for name in ('calendar.json', 'tournament_photos.json', 'player_profiles.json', 'news.json'):
              path = os.path.join('data', name)
              if os.path.exists(path):
                  json.load(open(path, encoding='utf-8-sig'))
                  print('OK:', name)
          print('JSON OK: турниров —', len(index['tournaments']))
          PY

      # 7. Сохраняем изменения в репозитории
      - name: Commit and push changes
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

          if git diff --quiet -- data/ calendars/; then
            echo "Нет изменений для сохранения"
          else
            git add data/ calendars/
            git commit -m "Автоматическое обновление расписания ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git push
            echo "Изменения сохранены и отправлены в репозиторий"
          fi

      # 8. Логируем результат
      - name: Summary
        if: always()
        run: |
          echo "### Обновление расписания завершено" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Время: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          python scripts/summarize.py >> $GITHUB_STEP_SUMMARY || true
