name: Обновление расписания турниров

on:
  # Запуск по расписанию: каждые 6 часов.
  # Скрипт кэширует каталог турниров, завершённые сезоны и фотографии,
  # поэтому суммарный расход — около 750 запросов в месяц при лимите 1000.
  schedule:
    - cron: '0 0,6,12,18 * * *'
  # Ручной запуск
  workflow_dispatch:

permissions:
  contents: write

# Одновременные запуски не должны конфликтовать при git push
concurrency:
  group: update-schedule
  cancel-in-progress: false

jobs:
  update-schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # 1. Получаем код репозитория
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Устанавливаем Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Кэш (экономит лимит API: каталог турниров, сезоны, фото)
      - name: Restore API cache
        uses: actions/cache@v4
        with:
          path: .cache
          # Уникальный ключ → всегда создаётся новая запись кэша;
          # restore-keys восстанавливает самый свежий предыдущий.
          key: tennis-cache-${{ github.run_id }}
          restore-keys: |
            tennis-cache-

      # 4. Проверяем синтаксис скрипта
      - name: Check script syntax
        run: python -m py_compile scripts/fetch_tennis.py

      # 5. Запускаем скрипт обновления
      - name: Fetch tournament data
        env:
          SPORTRADAR_API_KEY: ${{ secrets.SPORTRADAR_API_KEY }}
        run: python scripts/fetch_tennis.py

      # 6. Проверяем, что данные валидны
      - name: Validate data
        run: |
          python - <<'PY'
          import json, glob, os
          index = json.load(open('data/index.json', encoding='utf-8-sig'))
          assert 'tournaments' in index, 'index.json: нет списка турниров'
          for t in index['tournaments']:
              path = os.path.join('data', 'tournaments', t['slug'] + '.json')
              data = json.load(open(path, encoding='utf-8-sig'))
              assert 'years' in data, path
          json.load(open('data/rankings.json', encoding='utf-8-sig'))
          json.load(open('data/players.json', encoding='utf-8-sig'))
          print('JSON OK: турниров —', len(index['tournaments']))
          PY

      # 7. Сохраняем изменения в репозитории
      - name: Commit and push changes
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

          if git diff --quiet -- data/; then
            echo "Нет изменений для сохранения"
          else
            git add data/
            git commit -m "Автоматическое обновление расписания ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git push
            echo "Изменения сохранены и отправлены в репозиторий"
          fi

      # 8. Логируем результат
      - name: Summary
        if: always()
        run: |
          echo "### Обновление расписания завершено" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Время: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          python scripts/summarize.py >> $GITHUB_STEP_SUMMARY || true
