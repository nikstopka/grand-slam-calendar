name: Диагностика фильтров Live Tennis API

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe
        env:
          LIVETENNIS_API_KEY: ${{ secrets.LIVETENNIS_API_KEY }}
        run: |
          python - <<'PY'
          import os, json, urllib.request, urllib.error
          from urllib.parse import urlencode
          from datetime import date, timedelta

          key = os.environ["LIVETENNIS_API_KEY"]
          base = "https://api.livetennisapi.com/api/public/v1"
          today = date(2026, 10, 21)
          d30 = (today + timedelta(days=30)).isoformat()
          d60 = (today + timedelta(days=60)).isoformat()
          d90 = (today + timedelta(days=90)).isoformat()

          def probe(label, path, params, show=0):
              url = base + path + "?" + urlencode(params)
              req = urllib.request.Request(url, headers={"Accept": "application/json", "X-API-Key": key})
              try:
                  with urllib.request.urlopen(req, timeout=45) as r:
                      data = json.loads(r.read())
                  rows = data.get("data") or []
                  big = [x for x in rows if x.get("tier") in ("grand_slam", "atp_1000", "wta_1000")]
                  print(f"{label:46s} rows={len(rows)} из них БШ/M1000: {len(big)}")
                  for row in big[:show]:
                      print(f"      {row.get('tier')} {row.get('tournament')!r} {row.get('round_code')} "
                            f"{row.get('status')} {row.get('scheduled_time')} "
                            f"{[p.get('name') for p in (row.get('players') or {}).values() if p]}")
              except urllib.error.HTTPError as e:
                  print(f"{label:46s} HTTP {e.code} {e.read().decode('utf-8','replace')[:120]}")
              except Exception as e:
                  print(f"{label:46s} ERR {e}")

          probe("matches upcoming, окно 30 дней, без tier", "/matches",
                {"status": "upcoming", "from": today.isoformat(), "to": d30, "limit": 100}, 4)
          probe("matches upcoming, окно 60 дней, без tier", "/matches",
                {"status": "upcoming", "from": today.isoformat(), "to": d60, "limit": 100}, 4)
          probe("matches upcoming, окно 90 дней, tier", "/matches",
                {"status": "upcoming", "from": today.isoformat(), "to": d90,
                 "tier": "grand_slam,atp_1000,wta_1000", "limit": 100}, 6)
          probe("matches без status, окно 60 дней, tier", "/matches",
                {"from": today.isoformat(), "to": d60,
                 "tier": "grand_slam,atp_1000,wta_1000", "limit": 100}, 6)
          probe("fixtures, tier, без окна", "/fixtures",
                {"tier": "grand_slam,atp_1000,wta_1000", "limit": 100}, 4)
          probe("fixtures, tier, окно 90 дней", "/fixtures",
                {"tier": "grand_slam,atp_1000,wta_1000", "from": today.isoformat(),
                 "to": d90, "limit": 100}, 6)
          probe("fixtures, без tier, окно 90 дней", "/fixtures",
                {"from": today.isoformat(), "to": d90, "limit": 100}, 4)
          PY
