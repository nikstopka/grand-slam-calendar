name: Диагностика доступности эндпоинтов Sportradar

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe
        env:
          SPORTRADAR_API_KEY: ${{ secrets.SPORTRADAR_API_KEY }}
        run: |
          python - <<'PY'
          import os, json, urllib.request, urllib.error
          key = os.environ["SPORTRADAR_API_KEY"]
          print("ключ, длина:", len(key), "префикс:", key[:6])
          bases = {
              "trial": "https://api.sportradar.com/tennis/trial/v3/en",
              "production": "https://api.sportradar.com/tennis/production/v3/en",
          }
          probes = [
              ("/competitions", "каталог турниров"),
              ("/seasons", "сезоны"),
              ("/rankings", "рейтинг"),
              ("/schedules/2026-09-15/summaries", "дневная сводка (старый рабочий эндпоинт)"),
              ("/seasons/sr:season:120983/summaries", "сетка сезона"),
              ("/competitors/sr:competitor:225050/profile", "профиль игрока"),
          ]
          for base_name, base in bases.items():
              print(f"\n=== access_level = {base_name} ===")
              for path, label in probes:
                  url = f"{base}{path}.json?api_key={key}"
                  req = urllib.request.Request(url, headers={"Accept": "application/json"})
                  try:
                      with urllib.request.urlopen(req, timeout=30) as r:
                          body = r.read()
                          try:
                              data = json.loads(body)
                              keys = list(data.keys())[:6] if isinstance(data, dict) else type(data).__name__
                          except Exception:
                              keys = "не JSON"
                          print(f"  {r.status}  {label:42s} {path}  -> {keys}")
                  except urllib.error.HTTPError as e:
                      print(f"  {e.code}  {label:42s} {path}  -> {e.reason}")
                  except Exception as e:
                      print(f"  ERR  {label:42s} {path}  -> {e}")
          # Images API
          print("\n=== Images API ===")
          for provider in ("usat", "getty", "ap", "reuters"):
              for year in (2026, 2025):
                  url = (f"https://api.sportradar.com/tennis-images-t3/{provider}/tennis/"
                         f"headshots/players/{year}/manifest.json?api_key={key}")
                  req = urllib.request.Request(url, headers={"Accept": "application/json"})
                  try:
                      with urllib.request.urlopen(req, timeout=45) as r:
                          data = json.loads(r.read())
                          n = len(data.get("assets", []) or [])
                          print(f"  {r.status}  {provider} {year}: assets={n}")
                  except urllib.error.HTTPError as e:
                      print(f"  {e.code}  {provider} {year}: {e.reason}")
                  except Exception as e:
                      print(f"  ERR  {provider} {year}: {e}")
          PY
