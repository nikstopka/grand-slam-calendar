name: Диагностика Images API для тенниса

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe
        env:
          SPORTRADAR_API_KEY: ${{ secrets.SPORTRADAR_API_KEY }}
        run: |
          python - <<'PY'
          import os, json, urllib.request, urllib.error
          key = os.environ["SPORTRADAR_API_KEY"]
          base = "https://api.sportradar.com"

          variants = [
              # (описание, URL-путь, access_level, использовать заголовок)
              ("usat + league tennis, заголовок", "/tennis-images-t3/usat/tennis/headshots/players/2026/manifest.json", "t3", True),
              ("usat без league, заголовок",      "/tennis-images-t3/usat/headshots/players/2026/manifest.json", "t3", True),
              ("usat + league tennis, query",     "/tennis-images-t3/usat/tennis/headshots/players/2026/manifest.json", "t3", False),
              ("usat без league, query",          "/tennis-images-t3/usat/headshots/players/2026/manifest.json", "t3", False),
              ("getty + league tennis, заголовок","/tennis-images-t3/getty/tennis/headshots/players/2026/manifest.json", "t3", True),
              ("getty без league, заголовок",     "/tennis-images-t3/getty/headshots/players/2026/manifest.json", "t3", True),
              ("ap без league, заголовок",        "/tennis-images-t3/ap/headshots/players/2026/manifest.json", "t3", True),
              ("reuters без league, заголовок",   "/tennis-images-t3/reuters/headshots/players/2026/manifest.json", "t3", True),
              ("usat actionshots + league",       "/tennis-images-t3/usat/tennis/actionshots/players/2026/manifest.json", "t3", True),
              ("usat без league 2025",            "/tennis-images-t3/usat/headshots/players/2025/manifest.json", "t3", True),
              ("getty без league 2025",           "/tennis-images-t3/getty/headshots/players/2025/manifest.json", "t3", True),
              ("production getty без league",     "/tennis-images-p3/getty/headshots/players/2026/manifest.json", "p3", True),
          ]

          for desc, path, _lvl, use_header in variants:
              url = base + path
              if use_header:
                  url += "?api_key=" + key
                  headers = {"Accept": "application/json", "x-api-key": key}
              else:
                  headers = {"Accept": "application/json"}
              req = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=45) as r:
                      body = r.read()
                      try:
                          data = json.loads(body)
                          if isinstance(data, dict):
                              assets = data.get("assets")
                              if assets is None:
                                  for v in data.values():
                                      if isinstance(v, list) and v and isinstance(v[0], dict):
                                          assets = v
                                          break
                              n = len(assets) if isinstance(assets, list) else "?"
                              print(f"  {r.status}  {desc:42s} assets={n} keys={list(data.keys())[:6]}")
                          else:
                              print(f"  {r.status}  {desc:42s} тип={type(data).__name__}")
                      except Exception:
                          print(f"  {r.status}  {desc:42s} не JSON, {len(body)} байт")
              except urllib.error.HTTPError as e:
                  print(f"  {e.code}  {desc:42s} {e.reason}")
              except Exception as e:
                  print(f"  ERR  {desc:42s} {e}")
          PY
