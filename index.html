<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Большой шлем и не только — расписание турниров</title>
    <meta name="description" content="Живое расписание матчей Большого шлема, Masters 1000 и WTA 1000: результаты, live-счёт, обратный отсчёт и текущий рейтинг ATP/WTA.">
    <meta name="theme-color" content="#0d0d1a">
    <meta name="color-scheme" content="dark">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Большой шлем и не только — расписание турниров">
    <meta property="og:description" content="Календарь матчей Большого шлема, Masters 1000 и WTA 1000 с live-счётом и рейтингом игроков.">
    <meta property="og:locale" content="ru_RU">
    <meta name="twitter:card" content="summary">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=4">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%231a1a2e' stroke='%2300d4aa' stroke-width='4'/><text x='50' y='68' font-size='50' text-anchor='middle'>🎾</text></svg>">
</head>
<body>
    <a class="skip-link" href="#content">Перейти к списку матчей</a>

    <header class="header">
        <div class="header-content">
            <div class="logo">
                <span class="logo-icon">🎾</span>
                <h1>Большой шлем и не только</h1>
            </div>
            <div class="header-info">
                <div class="last-updated" id="lastUpdated" aria-live="polite">Загрузка...</div>
                <button class="refresh-btn" id="refreshBtn" title="Обновить" aria-label="Обновить расписание">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <div class="tabs-wrap">
        <nav class="tabs" id="tournamentTabs" role="tablist" aria-label="Турниры">
            <div class="tabs-loading">Загрузка турниров…</div>
        </nav>
    </div>

    <div class="demo-banner" id="demoBanner" style="display:none">
        <span>🧪 Показаны демонстрационные данные — настоящее расписание ещё не загружено.</span>
    </div>

    <div class="filters">
        <div class="filter-group year-group" id="yearFilterGroup" role="group" aria-label="Выбор года">
            <label class="filter-label" for="yearSelect">Год</label>
            <select class="filter-select" id="yearSelect" aria-label="Год турнира"></select>
        </div>
        <div class="filter-group" role="group" aria-label="Фильтр по категории">
            <button class="filter-btn active" data-gender="all">Все</button>
            <button class="filter-btn" data-gender="men">ATP</button>
            <button class="filter-btn" data-gender="women">WTA</button>
        </div>
        <div class="filter-group" role="group" aria-label="Фильтр по статусу">
            <button class="filter-btn active" data-filter="all">Все</button>
            <button class="filter-btn" data-filter="upcoming">Предстоящие</button>
            <button class="filter-btn" data-filter="live">Live</button>
            <button class="filter-btn" data-filter="finished">Завершённые</button>
        </div>
    </div>

    <main class="content" id="content" role="tabpanel">
        <div class="matches-grid">
            <div class="skeleton skeleton-card"></div>
            <div class="skeleton skeleton-card"></div>
            <div class="skeleton skeleton-card"></div>
        </div>
    </main>

    <footer class="footer">
        <p>
            Данные предоставлены <a href="https://developer.sportradar.com/" target="_blank" rel="noopener noreferrer">Sportradar</a>
            · Фотографии: <a href="https://commons.wikimedia.org/" target="_blank" rel="noopener noreferrer">Wikimedia Commons</a>
            · Обновляется автоматически через GitHub Actions
        </p>
    </footer>

    <noscript>
        <div class="noscript-warning">
            Для просмотра расписания матчей необходимо включить JavaScript.
        </div>
    </noscript>

    <script src="app.js?v=4"></script>
</body>
</html>
